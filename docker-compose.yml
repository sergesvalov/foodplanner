services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: food_user
      POSTGRES_PASSWORD: food_password
      POSTGRES_DB: food_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  # --- БЭКЕНД ---
  backend:
    build: ./backend
    container_name: menu_backend
    restart: always
    volumes:
      # База данных сохраняется в папку /opt/foodplanner на сервере (запрос пользователя)
      - /opt/foodplanner:/app/data
      # Монтируем код, чтобы изменения применялись сразу (и чтобы миграции сохранялись)
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://food_user:food_password@host.docker.internal:5432/food_db

    # ВАЖНО: Запускаем авто-мигратор перед сервером
    command: sh -c "python fast_migrate.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

    expose:
      - "8000"
    ports:
      - "0.0.0.0:8000:8000"
      # Можно убрать ports: "8000:8000", если не нужен прямой доступ к API снаружи.
      # Nginx будет общаться с бэкендом внутри сети Docker.

      # --- ФРОНТЕНД (NGINX) ---
  frontend:
    build: ./frontend
    container_name: menu_frontend
    restart: always
    ports:
      # СЛЕВА: Порт на сервере Ubuntu (внешний)
      # СПРАВА: Порт внутри контейнера (внутренний, Nginx слушает 80)
      - "8010:80"
    depends_on:
      - backend

volumes:
  pgdata:
